<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-view">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Login" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="go-to-register">Register</a></p>
    </div>

    <div id="register-view" style="display:none">
        <h2>Register</h2>
        <form id="register-form">
            <input type="text" id="register-username" placeholder="Login" required>
            <input type="password" id="register-password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="#" id="go-to-login">Login</a></p>
    </div>

    <div id="dashboard-view" style="display:none">
        <h2>Welcome, user <span id="dashboard-user-id"></span></h2>
        <button id="logout-btn">Logout</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
