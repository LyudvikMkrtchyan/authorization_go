<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-view" class="card">
        <h2>Login</h2>
        <p class="error-msg" id="login-error"></p>
        <form id="login-form">
            <input type="text" id="login-input" placeholder="Login" required>
            <input type="password" id="login-password-input" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="toggle-link">Don't have an account? <a href="#" id="go-to-register">Register</a></p>
    </div>

    <div id="register-view" class="card">
        <h2>Register</h2>
        <p class="error-msg" id="register-error"></p>
        <p class="success-msg" id="register-success"></p>
        <form id="register-form">
            <input type="text" id="register-input" placeholder="Login" required>
            <input type="password" id="register-password-input" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p class="toggle-link">Already have an account? <a href="#" id="go-to-login">Login</a></p>
    </div>

    <div id="dashboard-view" class="card">
        <h2 id="welcome-msg"></h2>
        <button id="logout-btn" class="btn-logout">Logout</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
